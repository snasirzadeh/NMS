services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nms}
      POSTGRES_USER: ${POSTGRES_USER:-nms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  api:
    build:
      context: ./backend
    restart: unless-stopped
    user: "${NMS_API_UID:-1000}:${NMS_API_GID:-1000}"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      NMS_ENVIRONMENT: ${NMS_ENVIRONMENT:-development}
      NMS_CONFIG_CONFIRMATION_SECRET: ${NMS_CONFIG_CONFIRMATION_SECRET:?NMS_CONFIG_CONFIRMATION_SECRET must be set in .env}
      USER: nms
      LOGNAME: nms
      SSH_IDENTITY_HOST_PREFIX: ${SSH_IDENTITY_HOST_PREFIX:-~/.ssh/keys}
      SSH_IDENTITY_CONTAINER_PREFIX: ${SSH_IDENTITY_CONTAINER_PREFIX:-/run/ssh-keys}
      SSH_UPLOADED_KEYS_DIR: ${SSH_UPLOADED_KEYS_DIR:-/run/nms-ssh-keys}
      SSH_UPLOADED_IDENTITY_HOST_PREFIX: ${SSH_UPLOADED_IDENTITY_HOST_PREFIX:-~/.ssh/nms-keys}
      SSH_UPLOADED_IDENTITY_CONTAINER_PREFIX: ${SSH_UPLOADED_IDENTITY_CONTAINER_PREFIX:-/run/nms-ssh-keys}
    group_add:
      - "${NMS_SSH_KEYS_GID:-1000}"
    volumes:
      - ${NMS_SSH_KEYS_HOST_DIR:-./local/ssh-keys}:/run/ssh-keys:ro
      - ${NMS_SSH_UPLOADED_KEYS_HOST_DIR:-./local/ssh-keys-uploaded}:/run/nms-ssh-keys:rw
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    networks:
      - backend
      - web
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${NMS_HTTP_PORT:-8080}:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - web

volumes:
  postgres_data:

networks:
  web:
  backend:
    internal: true
